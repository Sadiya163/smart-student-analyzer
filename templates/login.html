{% extends "base.html" %}
{% block title %}Login - Smart Student Analyzer{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="badge">WELCOME BACK</div>
        <h1>Login</h1>
        <p class="muted">Access your student performance dashboard.</p>

        <form method="POST">
            <label>Email</label>
            <input type="email" name="email" placeholder="you@example.com" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password" required>

            <button class="primary-btn" type="submit">Login</button>
        </form>

        <p class="auth-footer">Don't have an account?
            <a href="{{ url_for('register') }}">Create one</a>
        </p>
    </div>
</div>
{% endblock %}
